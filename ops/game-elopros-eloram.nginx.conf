# Eloram's HTTP side on the game box's 443, beside Gates' and oneshot's (their
# game-elopros-*.nginx.conf). The locations go inside the `server { server_name game.elopros.com;
# listen 443 ssl; ... }` block:
#
#   # in the game.elopros.com 443 server block
#   include /home/master/eloram-deploy/game-elopros-eloram.nginx.conf;
#
# then `sudo nginx -t && sudo systemctl reload nginx`. The server's HTTP side listens on loopback
# 8460 (ops/eloram.service); the page is on elopros.com (scripts/publish-web.sh --http
# https://game.elopros.com/eloram/) and reads these: `status.json` (the wire, for the store's
# list and the publish script's check), `cert-hash` (the port; the hash is null, the certificate
# CA-issued), `online.json` (the store's playtime), `records.json` and `records/<id>` (a match
# watched or replayed). The server answers CORS itself for `--cors-origin`, so nothing here adds
# a header. The game's own traffic is UDP 61260, straight to the server.

location /eloram/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8460/;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    # A record is read as it's written, a minute behind: no buffering of a long body.
    proxy_buffering off;
}
