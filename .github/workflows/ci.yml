name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, tests, no-alloc, determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler, clippy, rustfmt and the wasm32 target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (hot-path bans are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests, including the zero-allocation and determinism proofs (release for speed)
        run: cargo test --workspace --release
      - name: The same golden hashes without glam's scalar maths (the desktop client's prediction)
        run: cargo test -p el-sim --release --test determinism

  desktop:
    name: desktop client (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: The window's, the input's and the sound's libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libwayland-dev libasound2-dev libxkbcommon-dev
      # Its own cargo runs: el-server and el-bot turn glam's scalar maths on, which Bevy won't take.
      - name: Clippy (desktop client)
        run: cargo clippy -p el-client --features desktop --all-targets -- -D warnings
      - name: Tests (desktop client)
        run: cargo test -p el-client --features desktop --lib
      - name: Build
        run: cargo build -p el-client --features desktop --release --bin eloram

  wasm:
    name: browser client + wasm determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (must match the crate)
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Clippy (wasm client)
        run: cargo clippy -p el-client --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy (wasm client, WebGPU build)
        run: cargo clippy -p el-client --target wasm32-unknown-unknown --features webgpu -- -D warnings
      - name: Determinism on wasm32 (the same golden hashes as native)
        run: cargo test -p el-sim --target wasm32-unknown-unknown --release --test determinism
      - name: Build the web client
        run: ./scripts/build-web.sh webgl2
