[workspace]
resolver = "3"
members = ["crates/*"]
# el-client only pulls Bevy/web deps on wasm32, so native workspace builds stay light.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Anthony Eckert"]
repository = "https://github.com/AnthonE/Eloram"

[workspace.dependencies]
# Internal crates
el-alloc = { path = "crates/el-alloc" }
el-proto = { path = "crates/el-proto" }
el-sim = { path = "crates/el-sim", default-features = false }
el-match = { path = "crates/el-match" }
el-client-core = { path = "crates/el-client-core" }
el-server = { path = "crates/el-server" }

# Math: glam 0.32 is the version Bevy 0.19 re-exports, so the client shares types with no conversion.
glam = { version = "0.32.1", default-features = false, features = ["libm"] }
libm = "0.2.16"

# Lock-free queues (preallocated; push/pop never allocate)
crossbeam-queue = { version = "0.3.14", default-features = false, features = ["alloc"] }
rtrb = "0.4.0"

# Networking / server
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal"] }
wtransport = { version = "0.7.2", features = ["dangerous-configuration"] }
axum = "0.8.9"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures = "0.3.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
hex = "0.4"

# Browser client
bevy = { version = "0.19.1", default-features = false }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
web-sys = "0.3.105"
web-transport-wasm = "0.6.0"
console_error_panic_hook = "0.1.7"

# Testing / benches
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11"
wasm-bindgen-test = "0.3.78"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# These only fire where a crate-local clippy.toml configures them (el-sim, el-match):
# they are how the "no locks, no allocations in the hot path" rule is enforced.
disallowed_types = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 16

# Browser builds: small and fast to download.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
# "symbols" also drops the wasm `name` section (~60% of an unstripped Bevy build).
strip = "symbols"
panic = "abort"

# Benches keep debug symbols for profiling.
[profile.bench]
inherits = "release"
debug = "line-tables-only"
