[package]
name = "el-server"
description = "Eloram's game server: WebTransport sessions, the lobby, shard threads, HTTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
el-alloc.workspace = true
el-proto.workspace = true
el-sim = { workspace = true, features = ["deterministic"] }
el-match.workspace = true
el-client-core.workspace = true
el-auth = { path = "../el-auth", default-features = false, features = ["verify"] }
crossbeam-queue.workspace = true
getrandom = "0.3"
ring = { version = "0.17", default-features = false }
base64 = "0.22"
tokio.workspace = true
wtransport.workspace = true
axum.workspace = true
tower-http = { workspace = true, features = ["compression-gzip"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true
futures.workspace = true
# Elo Pros' API, on the blocking pool (`elopros::api`).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The UDP socket bound here, with its buffers asked for (`net::endpoint::bind_udp`).
socket2 = "0.6"

[dev-dependencies]
el-bot = { path = "../el-bot" }

[lints]
workspace = true
