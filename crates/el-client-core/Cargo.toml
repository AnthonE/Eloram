[package]
name = "el-client-core"
description = "Eloram's client without a transport: the clock, snapshots, prediction, interpolation, orders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
el-proto.workspace = true
el-sim.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true

# The prediction steps the server's own code, so it must take the same bits: natively that means
# glam's scalar maths; wasm (no `simd128`) has nothing else, and Bevy's glam won't build with it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
el-sim = { workspace = true, features = ["deterministic"] }

[lints]
workspace = true
