# The client's prediction steps el-sim and must take the server's bits whether glam's scalar
# maths are on (the server, wasm) or not (the desktop client, whose Bevy won't take the feature):
# glam's Vec2 has no SIMD form, the types below do.
disallowed-types = [
  { path = "glam::Vec3A", reason = "SIMD natively: prediction must take the server's bits with scalar-math or without (tests/determinism.rs)" },
  { path = "glam::Vec4", reason = "SIMD natively: prediction must take the server's bits with scalar-math or without (tests/determinism.rs)" },
  { path = "glam::Quat", reason = "SIMD natively: prediction must take the server's bits with scalar-math or without (tests/determinism.rs)" },
  { path = "glam::Mat2", reason = "SIMD natively: prediction must take the server's bits with scalar-math or without (tests/determinism.rs)" },
  { path = "glam::Mat3A", reason = "SIMD natively: prediction must take the server's bits with scalar-math or without (tests/determinism.rs)" },
  { path = "glam::Mat4", reason = "SIMD natively: prediction must take the server's bits with scalar-math or without (tests/determinism.rs)" },
  { path = "glam::Affine2", reason = "SIMD natively: prediction must take the server's bits with scalar-math or without (tests/determinism.rs)" },
  { path = "glam::Affine3A", reason = "SIMD natively: prediction must take the server's bits with scalar-math or without (tests/determinism.rs)" },
  { path = "glam::BVec3A", reason = "SIMD natively: prediction must take the server's bits with scalar-math or without (tests/determinism.rs)" },
  { path = "glam::BVec4A", reason = "SIMD natively: prediction must take the server's bits with scalar-math or without (tests/determinism.rs)" },
]
