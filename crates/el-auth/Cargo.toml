[package]
name = "el-auth"
description = "Eloram's wallet sign-in: the SIWE message both sides build, and the server's check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The browser only builds the message (default-features = false); the server verifies, and agents
# and tests sign.
default = ["verify", "sign"]
verify = ["dep:k256"]
sign = ["dep:k256"]

[dependencies]
el-proto.workspace = true
tiny-keccak = { version = "2.0", default-features = false, features = ["keccak"] }
# The curve and ECDSA recovery, nothing else.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"], optional = true }

[lints]
workspace = true

[[example]]
name = "sign"
required-features = ["sign"]
